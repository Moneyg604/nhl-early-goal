<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gill Sports · Desk</title>
<meta name="description" content="The Gill Sports research desk: best picks, sections, the board, the desk's logic and its graded record for NFL and NBA">
<meta name="theme-color" content="#0F1529">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gill Sports">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!--
  Gill Sports desk app. A static page: it reads what the site build publishes and never writes anything.
    ../nfl/weeks.json   -> current week; "app" names the slim feed (app.json) when the build wrote one
    ../nfl/app.json     -> the current week, trimmed to what this page reads (falls back to weeks/<week>.json)
    ../nfl/scorecard.json, ../nfl/live.json
    ../nba/days.json, ../nba/app.json (or days/<date>.json), ../nba/scorecard.json
  Field paths are the payload's own (games[], best_bets.ranked[], bot.desk, bot.desk_config, bot.hot), so the slim
  feed and the full payload read the same way.
-->
<style>
:root{
  --ink:#0F1529; --ink2:#0A0F20; --slate:#1A2340; --slate2:#212C4F; --slate3:#29365F;
  --line:rgba(190,205,240,.12); --line2:rgba(190,205,240,.22);
  --text:#EEF1F8; --muted:#B4BDD4; --dim:#8E99B9;
  --gold:#E6B84F; --gold2:#F5D27A; --goldbg:rgba(230,184,79,.12);
  --ice:#B49BFF; --icebg:rgba(180,155,255,.13);
  --green:#39D98A; --greenbg:rgba(57,217,138,.13); --red:#FF6B6B; --redbg:rgba(255,107,107,.13); --amber:#F3B63A; --amberbg:rgba(243,182,58,.13);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --r:20px; --r2:14px; --nav:66px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--barh,96px) + 64px)}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + var(--safe-b) + 24px);min-height:100vh}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 520px at 0% -8%,rgba(180,155,255,.11),transparent 62%),radial-gradient(760px 460px at 105% -4%,rgba(230,184,79,.09),transparent 58%),var(--ink)}
a{color:var(--ice);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.app{max-width:1120px;margin:0 auto;padding:0 16px}

/* ---------------------------------------------------------------- top bar */
.bar{position:sticky;top:0;z-index:30;padding-top:var(--safe-t);background:rgba(15,21,41,.8);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:12px 16px 6px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:11px;color:var(--text);min-width:0}
.brand:hover{text-decoration:none}
.brand .mark{width:40px;height:40px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 1px rgba(230,184,79,.35),0 6px 18px rgba(120,80,255,.22);flex:0 0 auto}
.brand .word{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.brand .word b{color:var(--gold);font-weight:800}
.brand .word small{display:block;font-family:var(--body);font-weight:500;font-size:13.5px;color:var(--gold2);opacity:.9;margin-top:4px;letter-spacing:0}
.seg{margin-left:auto;display:flex;background:var(--slate);border:1px solid var(--line);border-radius:999px;padding:3px;flex:0 0 auto}
.seg button{background:transparent;border:0;color:var(--muted);border-radius:999px;padding:8px 13px;font-size:14.5px;font-weight:600;cursor:pointer;min-height:36px;transition:background .2s,color .2s}
.seg button[aria-selected=true]{background:var(--slate3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.status{max-width:1120px;margin:0 auto;padding:2px 16px 10px;display:flex;flex-wrap:nowrap;align-items:center;gap:6px;font-size:13.5px;color:var(--dim);overflow:hidden}
.status .st{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.status .st b{color:var(--muted);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto}
.dot.old{background:var(--amber)}.dot.bad{background:var(--red)}
.status .st.warn{color:var(--amber);border-color:rgba(243,182,58,.35)}
.refresh{margin-left:auto;flex:0 0 auto;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);width:32px;height:28px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
@media (max-width:420px){.status .st.gm{display:none}}
.refresh svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------------------------------------------------------- type */
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,8.4vw,46px);letter-spacing:-.025em;line-height:1;margin:14px 0 6px}
.lede{color:var(--muted);max-width:66ch;margin:0 0 16px;font-size:16px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.015em;margin:30px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 .ct{font-family:var(--body);font-weight:600;font-size:14px;color:var(--dim);letter-spacing:0}
h2 .ct b{color:var(--gold2)}
h2 .nt{flex-basis:100%;font-family:var(--body);font-weight:500;font-size:14.5px;color:var(--dim);letter-spacing:0;margin-top:-4px}
.empty{background:rgba(255,255,255,.025);border:1px dashed var(--line2);border-radius:var(--r2);padding:14px 16px;color:var(--muted);font-size:15.5px;margin:0}
.empty b{color:var(--text)}
.note{background:var(--slate);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;font-size:15px;color:var(--muted)}
.note b{color:var(--text)}
.small{font-size:14px;color:var(--dim)}

/* ---------------------------------------------------------------- bento */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 6px}
.tile{position:relative;background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:13px 13px;min-height:98px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-width:0}
.tile .k{font-size:12.5px;color:var(--dim);font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.3}
.tile .v{font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,34px);letter-spacing:-.03em;line-height:1;margin-top:8px;white-space:nowrap}
.tile .v small{font-size:16.5px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:4px}
.tile .t{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.3}
.tile .v.pos{color:var(--green)}.tile .v.neg{color:var(--red)}
.tile.hero{grid-column:1/-1;min-height:132px;background:radial-gradient(420px 220px at 100% 0%,rgba(230,184,79,.22),transparent 70%),linear-gradient(160deg,#25305A,#1A2340 60%);border-color:rgba(230,184,79,.32)}
.tile.hero .v{font-size:58px;color:var(--gold2)}
.tile.hero .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.tile.hero .next{text-align:right;font-size:14px;color:var(--muted);line-height:1.35}
.tile.hero .next b{display:block;font-family:var(--display);font-size:18px;color:var(--text);letter-spacing:-.01em}
.tile.alert{border-color:rgba(255,107,107,.45);background:linear-gradient(160deg,rgba(255,107,107,.12),var(--slate) 70%)}
.tile.alert .v{color:var(--red)}
.tile.ok .v{color:var(--green)}
@media (min-width:860px){.bento{grid-template-columns:2.1fr 1fr 1fr 1fr}.tile.hero{grid-column:auto}}

/* ---------------------------------------------------------------- strips */
.strip{border:1px solid rgba(255,107,107,.45);background:var(--redbg);border-radius:var(--r2);padding:12px 14px;margin:12px 0;font-size:15px}
.strip b{color:var(--red)}
.strip ul{margin:6px 0 0;padding-left:18px}
.strip.amber{border-color:rgba(243,182,58,.45);background:var(--amberbg)}
.strip.amber b{color:var(--amber)}
.strip.info{border-color:var(--line2);background:rgba(255,255,255,.03);color:var(--muted)}
.strip.info b{color:var(--text)}

/* ---------------------------------------------------------------- filter rails */
.rail{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.rail button,.rail a{flex:0 0 auto;scroll-snap-align:start;background:var(--slate);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14.5px;color:var(--muted);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:38px;white-space:nowrap}
.rail a:hover{text-decoration:none;border-color:var(--line2)}
.rail button[aria-pressed=true]{background:var(--goldbg);border-color:rgba(230,184,79,.55);color:var(--gold2)}
.rail .n{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.08);border-radius:999px;padding:1px 7px;color:var(--text)}
.rail small{font-weight:500;color:var(--dim);font-size:13px}
.sticky{position:sticky;top:var(--barh,96px);z-index:10;background:linear-gradient(180deg,rgba(15,21,41,.92),rgba(15,21,41,.86));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin:12px -16px 0;padding:6px 16px 8px;border-bottom:1px solid var(--line)}
.sticky .rail{margin:0 -16px}
.sticky .rail+.rail{margin-top:4px}
.rail.jump button{background:transparent;min-height:34px;padding:6px 12px;font-size:14px}

/* ---------------------------------------------------------------- tickets */
.tickets{display:grid;gap:12px}
@media (min-width:860px){.tickets{grid-template-columns:1fr 1fr;align-items:start}}
.tk{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 42%),var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 0 24px;overflow:hidden;transition:border-color .2s,transform .2s}
.tk:before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--line2);
  -webkit-mask:radial-gradient(circle at 3.5px 50%,transparent 2.6px,#000 2.9px) 0 0/7px 11px repeat-y;mask:radial-gradient(circle at 3.5px 50%,transparent 2.6px,#000 2.9px) 0 0/7px 11px repeat-y}
.tk.best{border-color:rgba(230,184,79,.38);background:radial-gradient(380px 160px at 100% 0%,rgba(230,184,79,.10),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.03),transparent 42%),var(--slate)}
.tk.best:before{background:var(--gold)}
.tk.wild:before{background:var(--ice)}
.tk.done{opacity:.86}
.tk.won{border-color:rgba(57,217,138,.45)}.tk.won:before{background:var(--green)}
.tk.lost{border-color:rgba(255,107,107,.35)}.tk.lost:before{background:var(--red)}
.tk-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:13.5px;color:var(--dim);min-width:0}
.tk-top .meta{order:9;flex-basis:100%;min-width:0;white-space:normal}
.tk-top .cd{margin-left:auto;white-space:nowrap;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:3px 8px;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:rgba(255,255,255,.06);color:var(--muted);white-space:nowrap;flex:0 0 auto}
.pill.rk{background:var(--gold);color:#1b1402}
.pill.wild{background:var(--icebg);color:var(--ice)}
.tk-main{display:flex;gap:14px;align-items:center;margin-top:10px}
.tk-title{flex:1 1 auto;min-width:0}
.tk-title .who{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1.08}
.tk-title .bet{font-size:16.5px;color:var(--muted);margin-top:4px;font-weight:500}
.tk-title .bet b{font-weight:700}
.tk-title .bet .ov{color:var(--green)}.tk-title .bet .un{color:var(--ice)}
.ring{flex:0 0 auto;width:68px;height:68px;position:relative}
.ring svg{width:68px;height:68px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5.5}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.tk:not(.best) .ring .fg{stroke:var(--ice)}
.tk.won .ring .fg{stroke:var(--green)}.tk.lost .ring .fg{stroke:var(--red)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.03em;line-height:1}
.ring .n small{font-family:var(--body);font-weight:600;font-size:12px;color:var(--dim);margin-top:3px;letter-spacing:.05em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:9px;padding:4px 9px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.price{color:var(--text);font-family:var(--display);font-size:16.5px;font-weight:800;padding:3px 10px;background:rgba(255,255,255,.07)}
.chip.price small{font-family:var(--body);font-weight:600;color:var(--dim);font-size:13px}
.chip.g-A{color:var(--green);border-color:rgba(57,217,138,.4)}.chip.g-B{color:var(--gold2);border-color:rgba(230,184,79,.4)}.chip.g-C{color:var(--muted)}
.chip.warn{color:var(--amber);border-color:rgba(243,182,58,.45);background:var(--amberbg)}
.chip.bad{color:var(--red);border-color:rgba(255,107,107,.45);background:var(--redbg)}
.res{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.res.won{background:var(--greenbg);color:var(--green)}.res.lost{background:var(--redbg);color:var(--red)}.res.push{background:var(--amberbg);color:var(--amber)}
.res.void,.res.pending{background:rgba(255,255,255,.06);color:var(--muted)}
.res.live{background:var(--icebg);color:var(--ice)}
.res.live:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ice);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.final{font-size:14px;color:var(--muted);margin-top:8px}
.final b{color:var(--text)}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;margin-top:12px;font-size:13.5px;color:var(--dim)}
.cmp .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:99px;background:var(--dim);width:0;transition:width .9s var(--ease)}
.cmp .bar i.d{background:var(--gold)}.cmp .bar i.m{background:var(--ice)}
.cmp .v{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;text-align:right;min-width:36px}
.cmp .v.d{color:var(--gold2)}
.verdict{margin:12px 0 0;font-size:16px;line-height:1.5;color:var(--text)}
.tk:not(.open) .verdict{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.tk.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden;min-height:0}
.wu{padding-top:6px;font-size:15px;color:var(--muted)}
.wu h4{margin:16px 0 6px;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.03em;text-transform:uppercase}
.wu ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.wu ul.ar{list-style:none;padding:10px 12px;background:var(--ink2);border:1px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums;color:var(--text);font-size:14.5px;counter-reset:s}
.wu ul.ar li{counter-increment:s;display:grid;grid-template-columns:20px 1fr;gap:6px}
.wu ul.ar li:before{content:counter(s);color:var(--gold);font-weight:700}
.wu ul.pr li::marker{color:var(--green)}.wu ul.ri li::marker{color:var(--red)}
.wu .two{display:grid;gap:4px}
@media (min-width:600px){.wu .two{grid-template-columns:1fr 1fr;gap:18px}}
.wu .src{margin-top:14px;font-size:13.5px;color:var(--dim);line-height:1.6}
.wu .src a{color:var(--ice)}
.tk-foot{display:flex;border-top:1px solid var(--line);margin:14px -16px 0 -24px}
.tk-foot button{flex:0 0 auto;background:transparent;border:0;border-left:1px solid var(--line);color:var(--muted);font-size:14.5px;font-weight:600;padding:0 14px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tk-foot button:first-child{flex:1 1 auto;border-left:0;justify-content:flex-start;padding-left:24px}
.tk-foot button:hover{color:var(--text);background:rgba(255,255,255,.03)}
.tk-foot button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.tk.open .tk-foot .tg svg{transform:rotate(180deg)}
.tk-foot button.on{color:var(--gold2)}
/* compact row for a selection already listed above (a best pick inside its section) */
.mini{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:var(--r2);padding:10px 14px;font-size:15px;color:var(--muted);cursor:pointer;width:100%;text-align:left;min-height:46px}
.mini:hover{border-color:var(--line2)}
.mini b{color:var(--text);font-weight:600}
.mini .p{margin-left:auto;font-family:var(--display);font-weight:800;color:var(--gold2);font-size:16px}
.mini .star{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){
  .in{animation:rise .55s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .view.enter{animation:fade .28s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
@media (prefers-reduced-motion:reduce){.ring .fg,.cmp .bar i,.more{transition:none}}

/* ---------------------------------------------------------------- lists, tables */
details.fold{background:var(--slate);border:1px solid var(--line);border-radius:var(--r2);margin:10px 0}
details.fold>summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:10px;min-height:46px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform .25s}
details.fold[open]>summary:after{transform:rotate(225deg)}
details.fold>summary .ct{color:var(--dim);font-weight:500;font-size:14px}
details.fold .in2{padding:0 16px 14px;font-size:15px;color:var(--muted)}
details.fold ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.dec{display:grid;gap:8px}
.dec .d{border-top:1px solid var(--line);padding-top:8px}
.dec .d:first-child{border-top:0;padding-top:0}
.dec .d b{color:var(--text);font-weight:600;display:block}
.search{width:100%;background:var(--ink2);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:16.5px;margin:2px 0 10px}
.search::placeholder{color:var(--dim)}

/* ---------------------------------------------------------------- board */
.hot{display:grid;gap:10px}
@media (min-width:860px){.hot{grid-template-columns:1fr 1fr}}
.box{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.box h3{margin:0 0 4px;font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.box .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.box .r:first-of-type{border-top:0}
.box .r .l{min-width:0}
.box .r .l small{display:block;color:var(--dim);font-size:13.5px}
.up{color:var(--green);font-weight:700}.dn{color:var(--red);font-weight:700}
.tag{white-space:nowrap;font-size:13.5px;font-weight:700;border-radius:8px;padding:3px 8px}
.tag.up{background:var(--greenbg)}.tag.dn{background:var(--redbg)}
.brd{display:grid;gap:8px}
@media (min-width:860px){.brd{grid-template-columns:1fr 1fr}}
.brd .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;background:var(--slate);border:1px solid var(--line);border-radius:var(--r2);padding:11px 14px;align-items:center}
.brd .r.dk{border-color:rgba(230,184,79,.35)}
.brd .l b{font-weight:600;font-size:16px}
.brd .l small{display:block;color:var(--dim);font-size:13.5px;margin-top:2px}
.brd .p{text-align:right;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1}
.brd .p small{display:block;font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:0;margin-top:3px}
.brd .x{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13.5px;color:var(--dim);margin-top:6px;align-items:center}
.brd .x b{color:var(--text);font-weight:600}
.brd .x .pos{color:var(--green);font-weight:600}.brd .x .neg{color:var(--red);font-weight:600}
.brd .x .star{color:var(--gold2);font-weight:700}
.brd .x button{margin-left:auto;background:transparent;border:1px solid var(--line2);border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:600;padding:4px 9px;cursor:pointer;min-height:30px}
.brd .x button.on{color:var(--gold2);border-color:rgba(230,184,79,.5)}
.btn{background:var(--slate2);border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:10px 15px;font-size:15.5px;font-weight:600;cursor:pointer;min-height:44px}
.btn.gold{background:var(--gold);color:#1b1402;border-color:transparent}
.btn.ghost{background:transparent}
.btn:hover{border-color:var(--gold)}
.center{text-align:center;margin-top:12px}
select.sel{background:var(--slate);color:var(--text);border:1px solid var(--line2);border-radius:999px;padding:8px 12px;font-family:inherit;font-size:14.5px;min-height:38px}

/* ---------------------------------------------------------------- logic */
.rules{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:700px){.rules{grid-template-columns:repeat(3,1fr)}}
.rule{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.rule .k{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.rule .v{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:6px;line-height:1.2}
.rule p{margin:8px 0 0;font-size:14.5px;color:var(--muted)}
.secs{display:grid;gap:8px}
@media (min-width:700px){.secs{grid-template-columns:1fr 1fr}}
.secs .s{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--slate);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px}
.secs .s b{font-weight:700}
.secs .s .m{color:var(--dim);font-size:14px;margin-top:2px}
.secs .s .mm{font-family:var(--display);font-weight:800;font-size:18px;color:var(--gold2);white-space:nowrap}
.secs .s .mm small{font-family:var(--body);font-size:12.5px;color:var(--dim);font-weight:600;display:block;text-align:right}
.togs{display:flex;flex-wrap:wrap;gap:7px}
.togs button{display:inline-flex;align-items:center;gap:7px;background:var(--slate);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14.5px;cursor:pointer;color:var(--dim);font-weight:600;min-height:38px}
.togs button:before{content:'';width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.togs button[aria-pressed=true]{color:var(--text);border-color:rgba(230,184,79,.5)}
.togs button[aria-pressed=true]:before{background:var(--gold);border-color:var(--gold)}
.togs button.chg{box-shadow:0 0 0 2px rgba(180,155,255,.5)}
.inst{display:grid;gap:8px;counter-reset:i}
.inst .i{display:flex;gap:12px;background:var(--slate);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;font-size:15.5px;line-height:1.45}
.inst .i:before{counter-increment:i;content:counter(i);font-family:var(--display);font-weight:800;color:var(--gold);flex:0 0 auto;min-width:16px}
.inst .i.new{border-style:dashed;border-color:rgba(180,155,255,.55)}
.editor{margin-top:14px;background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.editor label{font-size:15px;color:var(--muted);display:block;margin-bottom:8px}
.editor textarea{width:100%;min-height:104px;background:var(--ink2);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:16.5px;line-height:1.45;resize:vertical}
.editor .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.steps{display:grid;gap:8px;margin-top:12px}
@media (min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps .s{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;font-size:14.5px;color:var(--muted)}
.steps .s b{display:block;font-family:var(--display);font-size:16.5px;color:var(--text);margin-bottom:3px}
.runs{display:flex;flex-wrap:wrap;gap:8px}
.runs .ru{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14.5px;color:var(--muted)}
.runs .ru b{color:var(--text);display:block;font-weight:600}
.runs .ru.nx{border-color:rgba(230,184,79,.5)}
.runs .ru.nx b{color:var(--gold2)}

/* ---------------------------------------------------------------- record */
.chart{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:10px}
.chart svg{display:block;width:100%;height:120px}
.chart .cap{display:flex;justify-content:space-between;font-size:13.5px;color:var(--dim);margin-top:6px}
.lb{display:grid;gap:8px}
.lb .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;background:var(--slate);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;align-items:center}
.lb .r.me{border-color:rgba(230,184,79,.45)}
.lb .r b{font-weight:600}
.lb .r small{display:block;color:var(--dim);font-size:13.5px;margin-top:2px}
.lb .u{font-family:var(--display);font-weight:800;font-size:20px;text-align:right}
.lb .u.pos{color:var(--green)}.lb .u.neg{color:var(--red)}
.lb .track{grid-column:1/-1;height:5px;border-radius:99px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.lb .track i{position:absolute;top:0;bottom:0;border-radius:99px}
.gl{display:grid;gap:6px}
.gl .r{display:flex;align-items:center;gap:10px;background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:15px}
.gl .r .l{min-width:0;flex:1}
.gl .r .l small{display:block;color:var(--dim);font-size:13.5px}
.gl .r .u{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px;text-align:right}
.gl .r .u.pos{color:var(--green)}.gl .r .u.neg{color:var(--red)}

/* ---------------------------------------------------------------- slip */
.slipbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--safe-b) + 12px);z-index:25;background:var(--gold);color:#1b1402;border:0;border-radius:999px;padding:0 18px;min-height:48px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;white-space:nowrap}
.slipbar .c{background:#1b1402;color:var(--gold2);border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;padding:0 7px}
.scrim{position:fixed;inset:0;background:rgba(5,8,18,.6);z-index:40;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86vh;overflow:auto;background:var(--slate);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--safe-b));transform:translateY(100%);transition:transform .35s var(--ease)}
.sheet.on{transform:none}
@media (min-width:860px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px}}
.sheet .grab{width:42px;height:5px;border-radius:99px;background:var(--line2);margin:2px auto 12px}
.sheet h3{font-family:var(--display);font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.sheet .lg{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:11px 0;font-size:15.5px}
.sheet .lg .l{flex:1;min-width:0}
.sheet .lg .l small{display:block;color:var(--dim);font-size:13.5px}
.sheet .lg .o{font-family:var(--display);font-weight:800}
.sheet .lg button{background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:16px}
.sheet .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sheet .sum>div{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sheet .sum .k{font-size:12.5px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sheet .sum .v{font-family:var(--display);font-weight:800;font-size:22px;margin-top:2px}

/* ---------------------------------------------------------------- skeleton */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:var(--r);border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

/* ---------------------------------------------------------------- nav, toast, foot */
.gnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(13,18,36,.9);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);display:flex}
.gnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:12px;font-weight:600;text-decoration:none;min-width:0}
.gnav a:hover{text-decoration:none;color:var(--muted)}
.gnav a .ic{width:52px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:background .25s}
.gnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gnav a[aria-current=page]{color:var(--gold2)}
.gnav a[aria-current=page] .ic{background:var(--goldbg)}
.tabs{max-width:1120px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:var(--slate);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;min-height:40px;cursor:pointer}
.tabs button.on{background:var(--goldbg);border-color:rgba(230,184,79,.55);color:var(--gold2)}
@media (min-width:860px) and (min-height:520px){
  body{padding-bottom:28px;padding-left:92px}
  .gnav{top:0;bottom:0;left:0;right:auto;width:84px;height:auto;flex-direction:column;justify-content:flex-start;padding-top:calc(var(--safe-t) + 92px);border-top:0;border-right:1px solid var(--line)}
  .gnav a{flex:0 0 auto;padding:12px 0}
  .slipbar{bottom:24px}
}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 70px);transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:600;font-size:15.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{color:var(--dim);font-size:13.5px;padding:34px 0 10px;line-height:1.6}
.foot a{color:var(--ice)}
</style>
</head>
<body>

<script>
'use strict';
// ------------------------------------------------------------------------------------------------ helpers
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// a rule from the spec read as a sentence: capital first letter, full stop at the end
const sentence = s => { s = String(s==null?'':s).trim(); if(!s) return s; s = s[0].toUpperCase() + s.slice(1); return /[.!?]$/.test(s) ? s : s + '.'; };
const pct = (x, d=0) => (x==null || isNaN(x)) ? '–' : (x*100).toFixed(d)+'%';
const am = d => (!d || d<=1) ? '' : (d>=2 ? '+'+Math.round((d-1)*100) : '-'+Math.round(100/(d-1)));
const num = (v, d=2) => (v==null || isNaN(v)) ? '–' : Number(v).toFixed(d);
const signed = (v, d=2) => (v==null || isNaN(v)) ? '–' : (v>=0?'+':'')+Number(v).toFixed(d);
const TZ = 'America/Toronto';
const iso = s => { s=String(s||''); if(/^\d{4}-\d\d-\d\d \d\d:\d\d UTC$/.test(s)) s=s.replace(' ','T').replace(' UTC','Z'); if(/T\d\d:\d\dZ$/.test(s)) s=s.replace('Z',':00Z'); return new Date(s); };
const ok = d => d instanceof Date && !isNaN(d);
const fmt = (s, o) => { const d=iso(s); return ok(d) ? d.toLocaleString('en-US', Object.assign({timeZone:TZ}, o)) : ''; };
const kickTxt = s => s ? fmt(s, {weekday:'short', hour:'numeric', minute:'2-digit'})+' ET' : '';
const stamp = s => { if(!s) return 'not yet'; const t=fmt(s, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); return t ? t+' ET' : String(s); };
const ago = s => { const d=iso(s); if(!s || !ok(d)) return ''; const m=Math.round((Date.now()-d)/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<48) return h+' h ago'; return Math.round(h/24)+' days ago'; };
const until = s => { const d=iso(s); if(!s || !ok(d)) return ''; const m=Math.round((d-Date.now())/60000); if(m<=0) return 'started'; if(m<60) return 'in '+m+' min'; const h=Math.floor(m/60), r=m%60; if(h<24) return 'in '+h+' h'+(r&&h<6?' '+r+' min':''); const dd=Math.round(h/24); return 'in '+dd+' day'+(dd===1?'':'s'); };
const hoursOld = s => { const d=iso(s); return (s && ok(d)) ? (Date.now()-d)/3600000 : Infinity; };
const nowIso = () => new Date().toISOString().slice(0,16)+'Z';
const SUFFIX = new Set(['jr','sr','ii','iii','iv','v']);
function nameKey(n){ n=String(n||'').trim(); if(!n) return ''; let first, rest;
  if(/^[A-Za-z]{1,2}\.[A-Za-z'-]{2,}/.test(n)){ const i=n.indexOf('.'); first=n.slice(0,i); rest=n.slice(i+1); } else { const i=n.indexOf(' '); first=i<0?n:n.slice(0,i); rest=i<0?'':n.slice(i+1); }
  const toks=rest.replace(/\./g,' ').trim().split(/\s+/).filter(t=>t && !SUFFIX.has(t.toLowerCase().replace(',','')));
  return (first.slice(0,1)+'.'+toks.join('')).toLowerCase(); }
const hash = s => { let h=2166136261; for(const c of String(s)){ h^=c.codePointAt(0); h=Math.imul(h,16777619); } return (h>>>0).toString(36); };
const link = s => (s && s.url && /^https?:\/\//i.test(s.url)) ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name||s.url)}</a>` : esc((s&&s.name)||'');
const store = {get(k, d){ try{ const v=localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
               set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
               del(k){ try{ localStorage.removeItem(k); }catch(e){} }};

const KIND = {ml:'Moneyline', spread:'Spread', total:'Game total', h1:'1st half total', h2:'2nd half total', qb_yds:'Passing yards', qb_td:'Passing TDs', rec_yds:'Receiving yards', recs:'Receptions', rush_yds:'Rushing yards', fg:'Kicker field goals', atd:'Anytime TD', pts:'Points', reb:'Rebounds', ast:'Assists', threes:'Threes', pra:'Pts + reb + ast', alts:'Alternate lines'};
const SHORT = {ml:'Moneyline', spread:'Spread', total:'Total', h1:'1H total', h2:'2H total', qb_yds:'Pass yds', qb_td:'Pass TDs', rec_yds:'Rec yds', recs:'Receptions', rush_yds:'Rush yds', fg:'FGs', atd:'Anytime TD', pts:'Points', reb:'Rebounds', ast:'Assists', threes:'Threes', pra:'PRA'};
const UNIT = {qb_yds:'passing yards', qb_td:'passing TDs', rec_yds:'receiving yards', recs:'receptions', rush_yds:'rushing yards', fg:'field goals', pts:'points', reb:'rebounds', ast:'assists', threes:'threes', pra:'pts + reb + ast'};
const NBA_SECTIONS = [{key:'pts',label:'Points',markets:['pts']},{key:'reb',label:'Rebounds',markets:['reb']},{key:'ast',label:'Assists',markets:['ast']},{key:'threes',label:'Threes and PRA',markets:['threes','pra']},{key:'game',label:'Moneyline, spreads, totals',markets:['ml','spread','total']}];
// the scheduled desk runs as set up in the owner's Claude chat (America/Toronto); desk_config.json "schedule" overrides
const NFL_RUNS = [{day:4,h:11,m:33,label:'Thursday night game'},{day:6,h:17,m:38,label:'Sunday slate'},{day:0,h:8,m:41,label:'Final pass + Monday night'},{day:1,h:14,m:37,label:'Monday night'}];

async function getJSON(url, ms=20000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms);
  try{ const r=await fetch(url, {cache:'no-cache', signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); } finally{ clearTimeout(t); } }
// the fields this page reads; the full payload is trimmed to these before it is kept on the phone
const GAME_KEYS = ['game_id','season','week','date','home','away','kickoff_utc','tip_utc','weekday','stadium','roof','surface','espn','lines','weather','temp','wind','actual','score','frozen','tier','state','status','completed'];
const BET_KEYS = ['id','game_id','mu','kick','kind','market','side','line','who','team','pid','label','odds','p','push','p_market','p_model','fair_odds','breakeven','ev','good','excluded','books','flags','price','group','priced_at','rank'];
const pick = (o, keys) => { const r={}; for(const k of keys) if(o && o[k]!==undefined) r[k]=o[k]; return r; };
function trim(P){ if(!P || P.app) return P; const bb=P.best_bets||{}; const bot=P.bot||{};
  return {app:{v:1, trimmed:'client'}, sport:P.sport, season:P.season, week:P.week, date:P.date, generated_utc:P.generated_utc,
    games:(P.games||[]).map(g=>pick(g, GAME_KEYS)),
    best_bets:Object.assign(pick(bb, ['book','generated','odds_fetched','props_fetched_oldest','n_priced']), {ranked:(bb.ranked||[]).map(b=>Object.assign(pick(b, BET_KEYS), {conf:b.conf?{score:b.conf.score, label:b.conf.label}:undefined, desk:b.desk?{p:b.desk.p, grade:b.desk.grade}:undefined}))}),
    bot:pick(bot, ['generated','week_label','stamps','desk','desk_config','hot'])}; }
const cacheKey = s => 'gs_app_cache_'+s;
async function load(quiet){
  const sport=S.sport, base=BASE[sport], token=++S.token;
  if(!base){ S.P=null; S.SC=null; S.err=null; S.loading=false; render(); return; }
  if(!S.P){ const c=store.get(cacheKey(sport), null); if(c && c.P){ S.P=c.P; S.SC=c.SC; S.cached=true; } else { S.loading=true; } render(); }
  spin(true);
  let P=null, err=null;
  try{
    const idx=await getJSON(base+(sport==='nfl'?'weeks.json':'days.json'));
    const cur=idx.current;
    const app=idx.app;
    if(app && app.file && app.current===cur && app.published===idx.published){ try{ P=await getJSON(base+app.file); }catch(e){ P=null; }
      const have = P ? (P.week!=null ? P.season+'-w'+String(P.week).padStart(2,'0') : P.date) : null; if(have!==cur) P=null; }
    if(!P) P=trim(await getJSON(base+(sport==='nfl' ? `weeks/${cur}.json` : `days/${cur}.json`), 60000));
    P._published=idx.published;
  }catch(e){ err=e; }
  if(token!==S.token) return;                       // the sport changed while this was loading
  let SC=null, LIVE=null;
  try{ SC=await getJSON(base+'scorecard.json'); }catch(e){ SC=S.SC; }
  if(sport==='nfl'){ try{ LIVE=await getJSON(base+'live.json', 10000); }catch(e){ LIVE=null; } }
  if(token!==S.token) return;
  if(P){ S.P=P; S.cached=false; S.err=null; if(!quiet) S.animated={}; store.set(cacheKey(sport), {P, SC}); }
  else S.err = S.P ? 'offline' : 'nodata';
  if(SC) S.SC=SC; S.LIVE=LIVE; S.loading=false; S.fetched=Date.now();
  spin(false); render(quiet ? 'auto' : false);
}
async function refreshLive(){ if(S.sport!=='nfl' || !S.P) return; try{ S.LIVE=await getJSON(BASE.nfl+'live.json', 10000); renderView('picks', 'auto'); renderStatus(); }catch(e){} }
function spin(on){ const b=$('#refresh'); if(b) b.classList.toggle('spin', !!on); }

// ------------------------------------------------------------------------------------------------ results
function liveRow(g){ const L=S.LIVE && S.LIVE.games && g && g.espn ? S.LIVE.games[g.espn] : null; return L || null; }
// won / lost / push / void / live / pending, with the actual number when there is one
function settle(x){
  const g=G()[x.game_id]; if(!g) return null;
  const k=startOf(g); if(!k || k>nowIso()) return null;
  const A=g.actual; let hs=null, as=null, final=false, L=null, h1=null;
  if(A && A.hs!=null){ hs=A.hs; as=A.as; final=true; h1=A.h1 ? A.h1[0]+A.h1[1] : null; }
  else { L=liveRow(g); if(L && (L.state==='in' || L.state==='post')){ hs=L.home_score; as=L.away_score; final=L.state==='post';
           if((L.home_line||[]).length>=2 && (L.period>=3 || final)) h1=L.home_line[0]+L.home_line[1]+L.away_line[0]+L.away_line[1]; } }
  const score = hs!=null ? `${g.away} ${as} – ${hs} ${g.home}` : '';
  const live = (note) => ({r:'live', note: note || (L && L.detail ? `${score} · ${L.detail}` : (score || 'in progress'))});
  const line = Number(x.line);
  const ou = (v, unit, done) => { if(v==null || isNaN(v)) return {r:'void', note:'no stat line'};
    if(!done){ return v>line ? (x.side==='over' ? {r:'won', v, note:`${v} ${unit} (over already)`} : {r:'lost', v, note:`${v} ${unit} (over already)`}) : live(`${v} ${unit} so far${score?' · '+score:''}`); }
    return {r: v===line ? 'push' : ((v>line)===(x.side==='over') ? 'won' : 'lost'), v, note:`${v} ${unit}`}; };
  const side = x.tside || (x.team ? (x.team===g.home ? 'home' : (x.team===g.away ? 'away' : null)) : null);
  if(hs==null) return live();
  switch(x.kind){
    case 'ml': return final ? {r: hs===as ? 'push' : ((x.side==='home')===(hs>as) ? 'won' : 'lost'), note:score} : live();
    case 'spread': { if(!final) return live(); const m=(x.side==='home' ? hs-as : as-hs)+line; return {r: m>0 ? 'won' : (m===0 ? 'push' : 'lost'), note:score}; }
    case 'total': { const r=ou(hs+as, 'points', final); if(r.note && score && final) r.note=score; return r; }
    case 'h1': return h1==null ? live() : ou(h1, 'first-half points', true);
    case 'h2': return (final && h1!=null) ? ou(hs+as-h1, 'second-half points', true) : live();
  }
  if(S.sport==='nba'){ if(!final) return live(); const st=(((A&&A.players)||{})[x.team]||{})[x.pid]; if(!st) return {r:'void', note:'no box-score line (did not play?)'}; return ou(st[x.kind], UNIT[x.kind]||'', true); }
  if(x.kind==='qb_yds' || x.kind==='qb_td'){
    const unit = x.kind==='qb_yds' ? 'passing yards' : 'passing TDs';
    const Lb = L || liveRow(g); const box = Lb && Lb.box && Lb.box.qb ? Lb.box.qb[nameKey(x.who)] : null;
    if(A && A.qb){ const q=A.qb[side];
      if(q && (!x.who || nameKey(q.name)===nameKey(x.who))) return ou(x.kind==='qb_yds' ? q.yds : q.td, unit, true);
      if(box) return ou(x.kind==='qb_yds' ? box.yds : box.td, unit, true);
      return q ? {r:'pending', note:`${q.name} was the main passer; the Record grades this pick`} : {r:'void', note:'did not play'}; }
    if(box) return ou(x.kind==='qb_yds' ? box.yds : box.td, unit, final);
    return final ? {r:'pending', note:'final · grading after the box score lands'} : live();
  }
  if(['rec_yds','rush_yds','recs'].includes(x.kind)){
    if(!(A && A.stats)) return final ? {r:'pending', note:'final · grading after the box score lands'} : live();
    const st=A.stats[x.pid]; if(!st) return {r:'void', note:'no stat line (inactive?)'};
    return ou(x.kind==='rec_yds' ? st.recyds : (x.kind==='rush_yds' ? st.ryds : st.rec), UNIT[x.kind], true);
  }
  if(x.kind==='fg'){ if(!(A && A.fg)) return live(); return ou(A.fg[side], 'field goals', true); }
  return final ? {r:'pending', note:score} : live();
}
const RES_TXT = {won:'Won', lost:'Lost', push:'Push', void:'Void', live:'In play', pending:'Final'};
const resChip = s => s ? `<span class="res ${s.r}">${RES_TXT[s.r]||s.r}</span>` : '';

// ------------------------------------------------------------------------------------------------ the desk's lists
let _L=null, _LP=null;
function lists(){ if(S.P && _LP===S.P) return _L; _LP=S.P; _L=buildLists(); return _L; }
function buildLists(){
  const d=DESK(); if(!d) return null;
  const all=(d.selections||[]), wild=(d.wild_cards||[]);
  const by={}; all.concat(wild).forEach(x=>by[x.id]=x);
  const out=all.filter(x=>!inSpec(x)).map(x=>Object.assign({}, x, {why:`${KIND[x.kind]||x.kind} is switched off in the spec`})).concat((d.excluded||[]).map(x=>Object.assign({mu:(G()[x.game_id]?`${G()[x.game_id].away} @ ${G()[x.game_id].home}`:'')}, x))), sel=all.filter(inSpec);
  const best=(d.best||[]).map(i=>by[i]).filter(x=>x && inSpec(x));
  const rank={}; best.forEach((x,i)=>rank[x.id]=i+1);
  const sections=specSections().map(sp=>{ const ids=(d.sections||{})[sp.key];
    const rows=(ids ? ids.map(i=>by[i]) : sel.filter(x=>(sp.markets||[]).includes(x.kind))).filter(x=>x && inSpec(x));
    return {sp, rows}; });
  const listed=new Set(best.map(x=>x.id)); sections.forEach(s=>s.rows.forEach(x=>listed.add(x.id)));
  const rest=sel.filter(x=>!listed.has(x.id));
  return {d, all:sel, best, rank, sections, rest, out, wild:wild.filter(inSpec), by};
}
const inGame = x => S.game==='all' || x.game_id===S.game;

// ------------------------------------------------------------------------------------------------ ticket
function titleOf(x){
  const sideTxt = x.side==='over' ? '<b class="ov">Over</b>' : (x.side==='under' ? '<b class="un">Under</b>' : '');
  if(x.who && x.line!=null) return {who:esc(x.who), bet:`${sideTxt} ${esc(x.line)} ${esc(UNIT[x.kind]||KIND[x.kind]||'')}`};
  if(x.kind==='ml') return {who:esc(x.team||x.label), bet:'to win the game · moneyline'};
  if(x.kind==='spread') return {who:esc(`${x.team} ${Number(x.line)>0?'+':''}${x.line}`), bet:'point spread'};
  if(['total','h1','h2'].includes(x.kind)) return {who:`${x.side==='over'?'Over':'Under'} ${esc(x.line)}`, bet:`${esc(KIND[x.kind])} · ${esc(x.mu||'')}`};
  return {who:esc(x.label), bet:esc(KIND[x.kind]||x.kind)};
}
function ring(p){ const r=29, c=2*Math.PI*r, off=c*(1-Math.max(0, Math.min(1, p||0))); const start=S.animated.picks ? off : c;
  return `<div class="ring" aria-label="desk win chance ${pct(p)}"><svg viewBox="0 0 68 68" aria-hidden="true"><circle class="bg" cx="34" cy="34" r="${r}"/><circle class="fg" cx="34" cy="34" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${start.toFixed(1)}" data-off="${off.toFixed(1)}"/></svg><div class="n">${pct(p)}<small>desk</small></div></div>`; }
function bars(x){ const B=x.board; if(!B || (B.p_market==null && B.p_model==null)) return '';
  const row=(k, v, c) => v==null ? '' : `<span>${k}</span><span class="bar"><i class="${c}" data-w="${Math.round(v*100)}" style="width:${S.animated.picks?Math.round(v*100):0}%"></i></span><span class="v ${c}">${pct(v)}</span>`;
  return `<div class="cmp" aria-label="desk against market and model">${row('Desk', x.p, 'd')}${row('Market', B.p_market, 'm')}${row('Model', B.p_model, '')}</div>`; }
function writeUp(x){
  const L=(t, a, cls) => (a||[]).length ? `<h4>${t}</h4><ul class="${cls||''}">${a.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>` : '';
  const src=(x.sources||[]).map(s=>`${link(s)} <span>(${esc(stamp(s.fetched))})</span>`).join(' · ');
  const B=x.board||{};
  const num2 = `Fair odds ${num(x.fair_odds)} · break-even at ${x.odds?pct(1/x.odds,1):'–'} · EV at the desk's chance ${x.ev!=null?signed(x.ev*100,1)+'%':'–'}${B.p!=null?` · site's blended chance ${pct(B.p)}`:' · not on the site board'}`;
  return `<div class="wu">${L("What the desk measured", x.inputs)}${L('The arithmetic', x.arithmetic, 'ar')}
    <div class="two"><div>${L('Why it wins', x.pros, 'pr')}</div><div>${L('How it loses', x.risks, 'ri')}</div></div>
    <h4>The numbers</h4><p style="margin:0">${esc(num2)}</p>
    <div class="src"><b>Sources</b> · ${src||'none listed'}</div></div>`; }
function ticket(x, i, kind){
  const s=settle(x), started=!upcoming(x); const open=S.open.has(x.id);
  const t=titleOf(x); const rk=kind==='best' ? (lists()||{rank:{}}).rank[x.id] : null;

  const cls=['tk', kind, started?'done':'', s&&s.r==='won'?'won':'', s&&s.r==='lost'?'lost':'', open?'open':'', S.animated.picks?'':'in'].filter(Boolean).join(' ');

    <div class="tk-main"><div class="tk-title"><div class="who">${t.who}</div><div class="bet">${t.bet}</div></div>${ring(x.p)}</div>
    ${s&&s.note?`<div class="final">${s.r==='live'?'Live: ':''}<b>${esc(s.note)}</b></div>`:''}
    <div class="chips"><span class="chip price">${num(x.odds)} <small>${esc(am(x.odds))} DK</small></span>
      <span class="chip g-${esc(x.grade)}">Grade ${esc(x.grade)}</span><span class="chip">${esc(x.evidence)} · ${esc(x.confidence)}</span>
      ${src[0]?`<span class="chip ${src[1]}">${src[1]?'⚠ ':''}${esc(src[0])}</span>`:''}
      ${x.alert?`<span class="chip bad">DraftKings moved: ${esc(x.alert.why)}</span>`:''}</div>
    ${bars(x)}
    <p class="verdict">${esc(x.verdict)}</p>
    <div class="more" id="${id}"><div>${open?writeUp(x):''}</div></div>
    <div class="tk-foot"><button type="button" class="tg" aria-expanded="${open}" aria-controls="${id}" data-act="open">${open?'Hide the write-up':'Full write-up'} <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      ${started?'':`<button type="button" data-act="slip" class="${inSlip?'on':''}" aria-pressed="${inSlip}">${inSlip?'✓ In slip':'+ Slip'}</button>`}<button type="button" data-act="copy" aria-label="Copy this pick">Copy</button></div>
  </article>`; }
function mini(x){ const l=lists(); const rk=l.rank[x.id]; const s=settle(x);
  return `<button type="button" class="mini" data-goto="${esc(x.id)}"><span class="star">★</span><span><b>${esc(x.label)}</b> · Best pick #${rk}</span>${s?resChip(s):''}<span class="p">${pct(x.p)}</span></button>`; }

  if(d.summary) h += `<h2>The desk's read on the ${S.sport==='nfl'?'week':'slate'}</h2><p class="note">${esc(d.summary)}</p>`;
  el.innerHTML = h;

}

  const now=new Date(); const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ, weekday:'short', hour:'numeric', minute:'numeric', hour12:false}).formatToParts(now).map(p=>[p.type,p.value]));
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday); const mins=wd*1440+(+parts.hour%24)*60+(+parts.minute);

  return rows; }

// countdowns every 30 s; live scores every 60 s while a desk game is on; everything every 5 min
setInterval(()=>{ $$('[data-until]').forEach(n=>{ n.textContent=until(n.dataset.until); }); }, 30000);
setInterval(()=>{ if(document.visibilityState!=='visible' || S.sport!=='nfl' || !S.P) return; const t=Date.now();
  const on=(S.P.games||[]).some(g=>{ const k=iso(startOf(g)); return ok(k) && t>k-10*60000 && t<+k+4.5*3600000 && !(g.actual&&g.actual.hs!=null); }); if(on) refreshLive(); }, 60000);
setInterval(()=>{ if(document.visibilityState==='visible' && S.sport!=='nhl') load(true); }, 5*60000);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('../sw.js').catch(()=>{}); }
render();
load();
</script>
</body>
</html>

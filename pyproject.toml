[project]
name = "earlygoal"
version = "0.5.0"
description = "NHL early-goal research engine: first 5 / first 10 minute markets, 1P and FG markets, 100k Monte Carlo per game"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "requests>=2.31"]

[project.scripts]
earlygoal = "earlygoal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

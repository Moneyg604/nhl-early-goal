name: Keeper

# Scheduler. GitHub's cron can take hours to start and cannot fire relative to the day's first puck drop, so this job
# sleeps until the next slate update or live-score snapshot is due, dispatches it, and hands over to a
# fresh keeper before the 6-hour job limit. It also fires a refresh two hours before the first game.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: true

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/keeper.py

name: Revalidate

# Reruns the walk-forward backtest (with simulation) on the most recent season that has enough games,
# and refreshes the validation panel the site shows. Dispatched by the keeper on the first of each month.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore season data
        uses: actions/cache@v4
        with:
          path: |
            data/sdv
            data/games_*.jsonl
            data/cache
            data/xg
          key: nhl-data-${{ github.run_id }}
          restore-keys: |
            nhl-data-
      - run: pip install -r requirements.txt
      - name: Play-by-play for five seasons
        run: python -m earlygoal ingest --source sdv --back 4 2>&1 | tee -a data/revalidate.log
      - name: Expected goals for five seasons
        run: python -m earlygoal xg --back 4 2>&1 | tee -a data/revalidate.log || echo "xG fetch skipped"
      - name: Re-test the switchable factors
        run: python -m earlygoal prune --with-sim 2>&1 | tee -a data/revalidate.log
      - name: Walk-forward backtest with simulation (three seasons)
        run: python -m earlygoal backtest --auto --with-sim --save 2>&1 | tee -a data/revalidate.log
      - name: Commit the validation
        if: always()
        run: |
          git config user.name "gill-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest_latest.json data/factors.json data/revalidate.log
          git commit -m "revalidate $(date -u +'%Y-%m-%d')" || echo "nothing changed"
          git pull --rebase origin main
          git push

name: Update NFL

on:
  schedule:
    # 13:20 UTC daily (9:20 am Eastern in daylight time): new play-by-play, injury reports, lines, weather
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "why this run happens (daily | t75 | update | weekly | props | research | quiet)"
        default: "update"
        required: false

permissions:
  contents: write
  pages: write
  actions: write

# its own group: a shared group would let a third queued run cancel a pending one. Both builds pull before
# publishing, so the site always carries the latest commit of each sport.
concurrency:
  group: update-nfl
  cancel-in-progress: false

jobs:
  nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore NFL data
        uses: actions/cache@v4
        with:
          path: |
            data/nfl/raw
            data/nfl/games_*.jsonl
            data/nfl/games_*.version
            data/nfl/snaps_*.json
            data/nfl/cache
          key: nfl-data-${{ github.run_id }}
          restore-keys: |
            nfl-data-

      - run: pip install -r requirements.txt

      - name: Play-by-play, schedule, injuries, depth charts, rosters (nflverse)
        run: python -m nfl ingest --back 3

      - name: Grade published weeks (track record)
        run: python -m nfl scorecard || echo "nothing to grade yet"

      - name: Research and simulate this week (and next week once its lines are out)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NFL_REASON: ${{ github.event.inputs.reason || 'daily' }}
        run: python -m nfl run --weeks 2

      - name: Build the NFL section
        run: python -m nfl publish

      - name: Commit the site
        run: |
          git config user.name "gill-sports-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nfl
          for f in data/nfl/odds.json data/nfl/odds_history.jsonl; do [ -f "$f" ] && git add "$f"; done; true
          git commit -m "nfl update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing changed"
          ok=0; for i in 1 2 3 4; do if git pull --rebase origin main && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep $((i * 7)); done; [ "$ok" = 1 ] || { echo "push failed after 4 tries"; exit 1; }

      - name: Publish the site (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          commit_message: "site ${{ github.run_number }} (nfl)"

      - name: Send to Telegram / Discord
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tools/notify_nfl.py --reason "${{ github.event.inputs.reason || 'daily' }}" 2>&1 | tee data/nfl/notify_status.txt || echo "notify skipped" | tee -a data/nfl/notify_status.txt
          echo "run $(date -u +'%Y-%m-%d %H:%M UTC') reason=${{ github.event.inputs.reason || (github.event.schedule != '' && 'schedule') || 'daily' }}" >> data/nfl/notify_status.txt
          git add data/nfl/notify_status.txt && git -c user.name=gill-sports-bot -c user.email=actions@users.noreply.github.com commit -q -m "nfl notify status" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; git rebase --abort 2>/dev/null || true; sleep 5; done || true

      - name: Keep the scheduler alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python tools/keeper.py --ensure || echo "keeper check skipped"

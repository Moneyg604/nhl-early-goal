name: Probe
on:
  workflow_dispatch:
    inputs:
      script:
        default: "tools/probe_dfo_lines.py"
      arg:
        default: "https://www.dailyfaceoff.com/teams/washington-capitals/line-combinations"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python "${{ github.event.inputs.script }}" "${{ github.event.inputs.arg }}" > data/probe.txt 2>&1 || true
      - run: |
          git config user.name "earlygoal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/probe.txt
          git commit -m "probe output" || echo "nothing"
          git pull --rebase origin main
          git push

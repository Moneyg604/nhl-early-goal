name: Telegram setup

# One-off: finds the chat that messaged the bot, sends a test message there, and remembers the chat id
# as a repository variable so every later build can post without any further setup.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Send a test message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python tools/notify.py --reason test 2>&1 | tee data/telegram_status.txt
      - name: Record the outcome (no secrets in it)
        if: always()
        run: |
          git config user.name "earlygoal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/telegram_status.txt
          git commit -m "telegram setup status" || echo "nothing"
          git pull --rebase origin main
          git push

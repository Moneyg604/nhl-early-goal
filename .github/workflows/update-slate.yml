name: Update slate

on:
  schedule:
    # UTC. Roughly 10:05, 15:05 and 18:35 Eastern during daylight time (one hour earlier in winter).
    - cron: "5 14 * * *"
    - cron: "5 19 * * *"
    - cron: "35 22 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "why this run happens (morning | update | t120)"
        default: "update"
        required: false

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: update-slate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore season data
        uses: actions/cache@v4
        with:
          path: |
            data/sdv
            data/games_*.jsonl
            data/cache
            data/xg
          key: nhl-data-${{ github.run_id }}
          restore-keys: |
            nhl-data-

      - run: pip install -r requirements.txt

      - name: Score earlier published days (track record)
        run: python -m earlygoal scorecard --pages docs/days/*.raw.html --scorecard docs/scorecard.json || echo "nothing to score yet"

      - name: Expected goals (MoneyPuck shot data; the current season refreshes daily)
        run: python -m earlygoal xg || echo "xG fetch skipped"

      - name: Research and simulate today's slate plus the next two days
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m earlygoal run --days 3 || echo "no slate today or run failed; publishing what exists"

      - name: Build the site
        run: python -m earlygoal publish

      - name: Commit the site
        run: |
          git config user.name "earlygoal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "slate update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "nothing changed"
          git pull --rebase origin main
          git push

      - name: Publish the site (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          commit_message: "site ${{ github.run_number }}"

      - name: Send the slate to Telegram / Discord (when a channel is configured)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: pip install -q requests && python tools/notify.py --reason "${{ github.event.inputs.reason || 'morning' }}" || echo "notify skipped"

      - name: Keep the scheduler alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python tools/keeper.py --ensure || echo "keeper check skipped"
